
<svg
  #svgRef
  class="banner-canvas"
  xmlns="http://www.w3.org/2000/svg"
  [attr.viewBox]="'0 0 ' + width + ' ' + height"
  [attr.width]="width"
  [attr.height]="height"
  role="img"
  [attr.aria-label]="
    'Banner profissional de ' + config().fullName
  "
>
  <defs>
    <linearGradient
      id="banner-background-gradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" [attr.stop-color]="config().bgColor" />
      <stop
        offset="100%"
        [attr.stop-color]="config().bgColor"
        stop-opacity="0.88"
      />
    </linearGradient>

    <linearGradient
      id="banner-accent-gradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop
        offset="0%"
        [attr.stop-color]="config().accentColor"
        stop-opacity="0.15"
      />
      <stop
        offset="50%"
        [attr.stop-color]="config().accentColor"
        stop-opacity="0.9"
      />
      <stop
        offset="100%"
        [attr.stop-color]="config().accentColor"
        stop-opacity="0.15"
      />
    </linearGradient>

    <radialGradient id="banner-glow">
      <stop
        offset="0%"
        [attr.stop-color]="config().accentColor"
        stop-opacity="0.24"
      />
      <stop
        offset="100%"
        [attr.stop-color]="config().accentColor"
        stop-opacity="0"
      />
    </radialGradient>

    <pattern
      id="banner-grid"
      width="28"
      height="28"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 28 0 L 0 0 0 28"
        fill="none"
        [attr.stroke]="config().accentColor"
        stroke-width="0.5"
        stroke-opacity="0.13"
      />
    </pattern>

    <clipPath id="banner-clip">
      <rect width="1584" height="396" />
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Background -->
    <rect
      width="1584"
      height="396"
      fill="url(#banner-background-gradient)"
    />

    <ellipse
      cx="1150"
      cy="195"
      rx="530"
      ry="290"
      fill="url(#banner-glow)"
    />

    <ellipse
      cx="200"
      cy="20"
      rx="420"
      ry="240"
      fill="url(#banner-glow)"
      opacity="0.35"
    />

    <!-- Optional grid -->
    @if (config().showSubtleGrid) {
      <rect
        width="1584"
        height="396"
        fill="url(#banner-grid)"
      />
    }

    <!-- Constellation network -->
    @if (config().networkStyle === 'constellation') {
      <g
        class="network"
        [attr.opacity]="config().networkOpacity"
      >
        @for (edge of edges; track $index) {
          <line
            [attr.x1]="edge.x1"
            [attr.y1]="edge.y1"
            [attr.x2]="edge.x2"
            [attr.y2]="edge.y2"
            [attr.stroke]="config().accentColor"
            stroke-width="0.8"
            stroke-opacity="0.45"
          />
        }

        @for (node of nodes; track trackNode($index)) {
          <circle
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            [attr.r]="node.radius + 4"
            [attr.fill]="config().accentColor"
            fill-opacity="0.08"
          />

          <circle
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            [attr.r]="node.radius"
            [attr.fill]="config().accentColor"]
            [attr.fill-opacity]="node.primary ? '0.65' : '0.32'"
            fill-opacity="0.75"
          />

          @if (config().showNetworkIcons && node.icon) {
            <svg:g renderTechnologyLogo 
              [type]="node.icon" 
              [x]="node.x" 
              [y]="node.y" 
              [color]="config().accentColor">
            </svg:g>
            <!-- {{ renderSubtleNetworkIcon(node.icon, node.x, node.y, config().accentColor) }} -->
            <!-- <text
              [attr.x]="node.x"
              [attr.y]="node.y - 9"
              text-anchor="middle"
              font-size="8"
              [attr.fill]="config().accentColor"
              fill-opacity="0.75"
            >
              {{ node.icon }}
            </text> -->
          }
        }
      </g>
    }

    <!-- Hex topology -->
    @if (config().networkStyle === 'hex-topology') {
      <g [attr.opacity]="config().networkOpacity">
        @for (hex of hexagons; track $index) {
          <polygon
            [attr.points]="
              hexagonPoints(hex.x, hex.y, hex.size)
            "
            fill="none"
            [attr.stroke]="config().accentColor"
            stroke-width="1"
            [attr.stroke-opacity]="hex.opacity + 0.15"
          />

          <circle
            [attr.cx]="hex.x"
            [attr.cy]="hex.y"
            r="2"
            [attr.fill]="config().accentColor"
            [attr.fill-opacity]="hex.opacity + 0.15"
          />
        }
      </g>
    }

    <!-- Circuit flow -->
    @if (config().networkStyle === 'circuit-flow') {
      <g
        fill="none"
        [attr.opacity]="config().networkOpacity"
        [attr.stroke]="config().accentColor"
      >
        @for (line of circuitLines; track $index) {
          <polyline
            [attr.points]="line.points"
            stroke-width="1.2"
            [attr.stroke-opacity]="line.opacity"
            stroke-linecap="round"
            stroke-linejoin="round"
            [attr.transform]="'translate(' + (850 + $index * 110) + ',40)'"
          />

          <circle
            [attr.cx]="850 + $index * 110 + 450"
            [attr.cy]="line.points.includes('290') ? 330 : 140"
            r="3"
            [attr.fill]="config().accentColor"
          />
        }
      </g>
    }

    <!-- Editorial accent -->
    @if (isEditorial()) {
      <rect
        x="54"
        y="88"
        width="4"
        height="205"
        rx="2"
        [attr.fill]="config().accentColor"
      />

      <rect
        x="72"
        y="90"
        width="1"
        height="200"
        [attr.fill]="config().accentColor"
        opacity="0.25"
      />
    }

    <!-- Name -->
    <text
      class="banner-name"
      [attr.x]="nameX()"
      [attr.y]="nameY()"
      [attr.text-anchor]="textAnchor()"
      [attr.font-family]="fontFamilyCss()"
      [attr.font-size]="config().nameFontSize"
      font-weight="700"
      [attr.fill]="config().accentColor"
    >
      {{ config().fullName }}
    </text>

    <!-- Role -->
    <text
      class="banner-role"
      [attr.x]="nameX()"
      [attr.y]="roleY()"
      [attr.text-anchor]="textAnchor()"
      [attr.font-family]="fontFamilyCss()"
      [attr.font-size]="config().roleFontSize"
      fill="#ffffff"
      fill-opacity="0.92"
    >
      {{ config().roleTitle }}
    </text>

    <!-- Tagline -->
    @if (config().showTagline && config().tagline) {
      <text
        class="banner-tagline"
        [attr.x]="nameX()"
        [attr.y]="taglineY()"
        [attr.text-anchor]="textAnchor()"
        [attr.font-family]="fontFamilyCss()"
        font-size="16"
        fill="#ffffff"
        fill-opacity="0.68"
      >
        {{ config().tagline }}
      </text>
    }

    <!-- Text divider -->
    <line
      [attr.x1]="isCentered() ? 742 : nameX()"
      [attr.x2]="isCentered() ? 842 : nameX() + 100"
      [attr.y1]="config().showTagline ? 298 : 290"
      [attr.y2]="config().showTagline ? 298 : 290"
      [attr.stroke]="config().accentColor"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Technology badges -->
    <g class="tech-badges">
      @for (tech of badgeItems(); track trackTech($index, tech); let i = $index) {
        <g
          [attr.transform]="
            'translate(' +
            (getBadgeX(i, badgeItems().length)) +
            ',' +
            getBadgeY() +
            ')'
          "
        >
          @if (config().logoBadgeStyle === 'glass-pill') {
            <rect
              x="0"
              y="0"
              [attr.width]="getBadgeWidth(tech)"
              height="34"
              rx="17"
              fill="#ffffff"
              fill-opacity="0.08"
              stroke="#ffffff"
              stroke-opacity="0.18"
            />

            <circle
              cx="17"
              cy="17"
              r="7"
              [attr.fill]="techColor(tech)"
              fill-opacity="0.95"
            />

            <text
              x="17"
              y="20"
              text-anchor="middle"
              font-size="7"
              font-weight="700"
              fill="#ffffff"
            >
              {{ techInitials(tech.name) }}
            </text>

            <text
              x="31"
              y="21"
              font-size="12"
              font-weight="500"
              fill="#ffffff"
            >
              {{ tech.name }}
            </text>
          }

          @if (config().logoBadgeStyle === 'minimal-clean') {
            <g>
              <circle
                cx="8"
                cy="14"
                r="4"
                [attr.fill]="techColor(tech)"
              />

              <text
                x="19"
                y="18"
                font-size="12"
                font-weight="500"
                fill="#ffffff"
              >
                {{ tech.name }}
              </text>
            </g>
          }

          @if (config().logoBadgeStyle === 'icon-above') {
            <g>
              <rect
                x="0"
                y="0"
                [attr.width]="getBadgeWidth(tech)"
                height="62"
                rx="10"
                fill="#ffffff"
                fill-opacity="0.055"
                stroke="#ffffff"
                stroke-opacity="0.13"
              />

              <circle
                [attr.cx]="getBadgeWidth(tech) / 2"
                cy="21"
                r="11"
                [attr.fill]="techColor(tech)"
                fill-opacity="0.2"
                [attr.stroke]="techColor(tech)"
                stroke-opacity="0.7"
              />

              <text
                [attr.x]="getBadgeWidth(tech) / 2"
                y="24"
                text-anchor="middle"
                font-size="9"
                font-weight="700"
                [attr.fill]="techColor(tech)"
              >
                {{ techInitials(tech.name) }}
              </text>

              <text
                [attr.x]="getBadgeWidth(tech) / 2"
                y="48"
                text-anchor="middle"
                font-size="10"
                font-weight="500"
                fill="#ffffff"
              >
                {{ tech.name }}
              </text>
            </g>
          }
        </g>
      }
    </g>
  </g>
</svg>
