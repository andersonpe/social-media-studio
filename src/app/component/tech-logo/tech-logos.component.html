    <svg:g> 
    @switch (id()) {
      @case ('angular') {
        <!-- Angular Shield -->
        <polygon
          [attr.points]="'24,4 6,10.4 8.8,34.2 24,44 39.2,34.2 42,10.4'"
          [attr.fill]="angularColors().leftShield"
        />
        <polygon
          [attr.points]="'24,4 24,8.4 24,44 39.2,34.2 42,10.4'"
          [attr.fill]="angularColors().rightShield"
        />
        <!-- 'A' Mark -->
        <path
          [attr.d]="'M24 8.8L12.8 33.8H17 L19.3 28.1H28.7L31 33.8H35.2L24 8.8ZM20.9 24.4L24 16.9L27.1 24.4H20.9Z'"
          [attr.fill]="angularColors().letterFill"
        />
      }

      @case ('react') {
        <circle cx="24" cy="24" r="3.8" [attr.fill]="reactColors().strokeColor" />
        <g [attr.stroke]="reactColors().strokeColor" strokeWidth="2.3" fill="none">
          <ellipse cx="24" cy="24" rx="19" ry="7.4" />
          <ellipse cx="24" cy="24" rx="19" ry="7.4" transform="rotate(60 24 24)" />
          <ellipse cx="24" cy="24" rx="19" ry="7.4" transform="rotate(120 24 24)" />
        </g>
      }

      @case ('php') {
        <!-- Official PHP Oval Emblem -->
        <ellipse
          cx="24"
          cy="24"
          rx="20.5"
          ry="11.5"
          [attr.fill]="phpColors().ovalFill"
          [attr.stroke]="phpColors().ovalStroke"
          strokeWidth="1.5"
        />
        <text
          x="24"
          y="27.8"
          textAnchor="middle"
          [attr.fill]="phpColors().textFill"
          fontSize="13.5"
          fontWeight="800"
          fontStyle="italic"
          letterSpacing="0.4"
          style="font-family: 'Plus Jakarta Sans', Arial, sans-serif"
        >
          php
        </text>
      }

      @case ('dotnet') {
        <!-- Official Microsoft .NET Badge -->
        <rect
          x="4"
          y="8"
          width="40"
          height="32"
          rx="8"
          [attr.fill]="dotnetColors().badgeFill"
          [attr.stroke]="dotnetColors().badgeStroke"
          strokeWidth="1.2"
        />
        <text
          x="24"
          y="28.5"
          textAnchor="middle"
          [attr.fill]="dotnetColors().textFill"
          fontSize="13.5"
          fontWeight="800"
          letterSpacing="-0.3"
          style="font-family: 'Plus Jakarta Sans', Arial, sans-serif"
        >
          .NET
        </text>
      }

      @case ('postgresql') {
        <!-- PostgreSQL Stylized Elephant & Shield -->
        <path
          [attr.d]="'M11 14C11 8.5 16.8 5 24 5C31.2 5 37 8.5 37 14V25.5C37 33.5 30.8 40.5 24 43C17.2 40.5 11 33.5 11 25.5V14Z'"
          [attr.fill]="postgresColors().baseBlue"
          [attr.stroke]="postgresColors().lightBlue"
          strokeWidth="1.8"
        />
        <!-- Left & Right Ears + Trunk Silhouette -->
        <path
          [attr.d]="'M15.5 16.5C12.5 17 11.5 21 12.8 25.2C14 29 17.2 30 18.8 28.5M32.5 16.5C35.5 17 36.5 21 35.2 25.2C34 29 30.8 30 29.2 28.5'"
          fill="none"
          [attr.stroke]="postgresColors().strokeTone"
          strokeWidth="2.2"
          strokeLinecap="round"
        />
        <!-- Elephant Head & Trunk Curve -->
        <path
          [attr.d]="'M18.5 15.5C18.5 12.2 21 10.5 24 10.5C27 10.5 29.5 12.2 29.5 15.5V24.5C29.5 29.5 27.5 35.5 24.2 35.5C21.8 35.5 20.8 33.5 21.5 31.5'"
          fill="none"
          [attr.stroke]="postgresColors().strokeTone"
          strokeWidth="2.4"
          strokeLinecap="round"
        />
        <!-- Eyes -->
        <circle cx="21.5" cy="18.2" r="1.4" [attr.fill]="postgresColors().strokeTone" />
        <circle cx="26.5" cy="18.2" r="1.4" [attr.fill]="postgresColors().strokeTone" />
        <!-- Tusk detail -->
        <path
          [attr.d]="'M27.8 26.5C29.8 27.8 31.5 27.2 32.2 25.8'"
          fill="none"
          [attr.stroke]="postgresColors().lightBlue"
          strokeWidth="2.1"
          strokeLinecap="round"
        />
      }

      @case ('oracle') {
        <!-- Official Oracle signature capsule O-mark -->
        <rect
          x="5.5"
          y="13.5"
          width="37"
          height="21"
          rx="10.5"
          fill="none"
          [attr.stroke]="oracleColors().oracleRed"
          strokeWidth="5.2"
        />
      }

      @case ('sqlserver') {
        <!-- Database Cylinder + Microsoft SQL Server Dynamic Ribbons -->
        <ellipse cx="24" cy="11.5" rx="14.5" ry="5.2" [attr.fill]="sqlServerColors().primaryRed" />
        <ellipse cx="24" cy="11.5" rx="10.5" ry="3" [attr.fill]="sqlServerColors().deepRed" />
        <!-- Top Ribbon -->
        <path
          [attr.d]="'M9.5 15.5C9.5 18.8 16 21.2 24 21.2C32 21.2 38.5 18.8 38.5 15.5V21C38.5 24.3 32 26.7 24 26.7C16 26.7 9.5 24.3 9.5 21V15.5Z'"
          [attr.fill]="sqlServerColors().primaryRed"
        />
        <!-- Middle Dynamic Swoosh -->
        <path
          [attr.d]="'M9.5 24.5C9.5 27.8 16 30.2 24 30.2C32 30.2 38.5 27.8 38.5 24.5V30C38.5 33.3 32 35.7 24 35.7C16 35.7 9.5 33.3 9.5 30V24.5Z'"
          [attr.fill]="sqlServerColors().deepRed"
        />
        <!-- Bottom Base -->
        <path
          [attr.d]="'M9.5 33.2C9.5 36.5 16 39 24 39C32 39 38.5 36.5 38.5 33.2V36.8C38.5 40.1 32 42.5 24 42.5C16 42.5 9.5 40.1 9.5 36.8V33.2Z'"
          [attr.fill]="sqlServerColors().primaryRed"
        />
        <!-- Diagonal SQL Server Swooshes -->
        <path
          [attr.d]="'M12.5 19.5C18 22.8 29.5 21.8 36.5 17.5'"
          [attr.stroke]="sqlServerColors().highlight"
          strokeWidth="1.6"
          fill="none"
          strokeLinecap="round"
        />
        <path
          [attr.d]="'M12.5 28.5C18 31.8 29.5 30.8 36.5 26.5'"
          [attr.stroke]="sqlServerColors().highlight"
          strokeWidth="1.6"
          fill="none"
          strokeLinecap="round"
        />
      }
    }
  </svg:g>
