    </nav>

    <div class="flex items-center gap-3">
      
      <button
        type="button"
        (click)="onClickResetEventHandler()"
        class="px-4 py-2 text-xs font-semibold text-[#04241d] bg-emerald-400 hover:bg-emerald-300 rounded-lg transition-colors whitespace-nowrap flex items-center gap-2 shadow-sm cursor-pointer disabled:opacity-50">
        <svg lucideRepeat class="w-3.5 h-3.5"></svg>
        <span>Restaurar Padrão</span>
      </button>

      <button
        type="button"
        (click)="onClickCopyEventHandler()"
        class="px-3.5 py-2 text-xs font-medium text-slate-200 bg-emerald-950/60 border border-emerald-800/60 rounded-lg hover:bg-emerald-900/60 transition-colors whitespace-nowrap flex items-center gap-2 cursor-pointer">

        @if (copiedSuccess()) {
          <svg lucideCheck class="w-3.5 h-3.5 text-emerald-400"></svg>
          <span>Copiado</span>
        } @else {
          <svg lucideCopy class="w-3.5 h-3.5 text-emerald-400"></svg>
          <span>Copiar PNG</span>
        }
      </button>

      <button
        type="button"
        (click)="onClickDownloadEventHandler()"
        [disabled]="isExporting()"
        class="px-4 py-2 text-xs font-semibold text-[#04241d] bg-emerald-400 hover:bg-emerald-300 rounded-lg transition-colors whitespace-nowrap flex items-center gap-2 shadow-sm cursor-pointer disabled:opacity-50">

        <svg lucideDownload class="w-3.5 h-3.5"></svg>
        <span>Baixar PNG (1584×396)</span>
      </button>
    </div>
  </header>
